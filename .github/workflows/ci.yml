name: CI utils

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-utils-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate utils
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm

      - run: npm ci
      - run: npm run setup:browser -- --with-deps
      - run: npm run validate
      - run: docker build --file docker-grader/Dockerfile --tag course-grader:ci .
